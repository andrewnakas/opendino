name: diloco

# Capped DiLoCo training burst on free GitHub runners. Worker 0 also coordinates.
# Other machines (Kaggle, Colab, volunteers) can join the same run with `python -m opendino.diloco work`.
#
#   gh workflow run diloco.yml -f repo=nakas/opendino-run-pilot -f workers=4 -f hours=5
# The run repo is created at round 0 from `config` on the first launch.
#
# Usage policy (GitHub Actions terms): bounded bursts, not a standing fleet. Default 4 runners,
# hard maximum 8, at most one burst running at a time.

on:
  workflow_dispatch:
    inputs:
      repo: {description: "HF model repo of the run (created by `opendino.diloco init`)", required: true}
      set: {description: "in100 | in1k", required: true, default: in100}
      workers: {description: "runners in this burst (1-8)", required: true, default: "4"}
      hours: {description: "hours per runner (max 5.5)", required: true, default: "5"}
      config: {description: "config used only if the run repo is new", required: false, default: configs/diloco_in100_vits16.yaml}

concurrency:
  group: diloco
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CACHES_REPO: nakas/opendino-caches

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env: {W: "${{ inputs.workers }}"}
        run: |
          W=$(( W < 1 ? 1 : (W > 8 ? 8 : W) ))
          echo "matrix={\"worker\":[$(seq -s, 0 $((W-1)))]}" >> "$GITHUB_OUTPUT"
          echo "W=$W"

  init:
    # Creates the run repo at round 0 if it does not exist yet; leaves an existing run untouched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - name: Initialise run if new
        env: {REPO: "${{ inputs.repo }}", CONFIG: "${{ inputs.config }}"}
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e . huggingface_hub
          if python -c "import os,sys; from opendino.diloco import Hub; sys.exit(0 if Hub(os.environ['REPO']).latest_round() >= 0 else 1)" 2>/dev/null; then
            echo "$REPO already initialised; resuming"
          else
            python -m opendino.diloco init --config "$CONFIG" --repo "$REPO"
          fi

  work:
    needs: [plan, init]
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      WORKER: ${{ matrix.worker }}
      NWORK: ${{ strategy.job-total }}
      SET: ${{ inputs.set }}
      HOURS: ${{ inputs.hours }}
      REPO: ${{ inputs.repo }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - name: Install (CPU-only torch)
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e . huggingface_hub pyarrow
      - name: Pick this worker's slices
        run: |
          python - <<'EOF' > slice.env
          import os
          from huggingface_hub import HfApi
          s, w, n = os.environ["SET"], int(os.environ["WORKER"]), int(os.environ["NWORK"])
          files = HfApi().list_repo_files(os.environ["CACHES_REPO"], repo_type="dataset")
          teachers = sorted({f.split("/")[1] for f in files if f.startswith(f"{s}/") and f.count("/") >= 3})
          # slice ids present for every teacher
          per_t = [{int(f.split("/")[2].split("_")[1]) for f in files if f.startswith(f"{s}/{t}/part_")} for t in teachers]
          parts = sorted(set.intersection(*per_t))
          total = max(parts) + 1
          mine = parts[w * len(parts) // n:(w + 1) * len(parts) // n] or parts[w % len(parts):][:1]
          print("TEACHERS='" + " ".join(teachers) + "'")
          print("TOTAL=" + str(total))
          print("PARTS='" + " ".join(map(str, mine)) + "'")
          EOF
          cat slice.env
      - name: Rebuild image slices and download matching caches
        run: |
          source slice.env
          STRIDE=${{ inputs.set == 'in100' && '10' || '1' }}
          for p in $PARTS; do
            python scripts/shards_from_hf.py --split train --worker "$p" --workers "$TOTAL" \
              --class-stride "$STRIDE" --out "data/shards/$(printf part_%03d $p)" --cache-dir /tmp/hfcache
          done
          INC=(); for t in $TEACHERS; do for p in $PARTS; do INC+=("$SET/$t/$(printf part_%03d $p)_*/*"); done; done
          hf download "$CACHES_REPO" --repo-type dataset --include "${INC[@]}" --local-dir data/caches
          df -h . | tail -1
      - name: Train
        run: |
          source slice.env
          SHARDS=(); for p in $PARTS; do SHARDS+=("data/shards/$(printf part_%03d $p)"); done
          CACHE_ARGS=()
          for t in $TEACHERS; do
            DIRS=""; for p in $PARTS; do DIRS="$DIRS$(ls -d data/caches/$SET/$t/$(printf part_%03d $p)_* | sort | paste -sd, -),"; done
            CACHE_ARGS+=(--cache "$t=${DIRS%,}")
          done
          COORD=(); if [ "$WORKER" = 0 ]; then COORD=(--coordinator --expect "$NWORK"); fi
          python -m opendino.diloco work --repo "$REPO" --worker "gh-$WORKER" --shards "${SHARDS[@]}" \
            "${CACHE_ARGS[@]}" --hours "$HOURS" "${COORD[@]}"
