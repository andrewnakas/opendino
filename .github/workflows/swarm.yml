name: swarm

# Fan teacher caching out over many free GitHub runners; results go to a public Hugging Face dataset.
# Image shards are never stored: each runner rebuilds its slice from the gated ILSVRC/imagenet-1k
# Parquet files (deterministic), and each cache part carries a label fingerprint so a later rebuild
# is verified to line up row for row.
#
#   gh workflow run swarm.yml -f stage=pca   -f set=in100 -f teacher=dinov2_l
#   gh workflow run swarm.yml -f stage=cache -f set=in100 -f teacher=dinov2_l -f parts=20
#
# Usage policy: bounded bursts only (GitHub's Actions terms forbid disproportionate use).
# Needs repo secret HF_TOKEN (gated ImageNet read + write to the caches repo).

on:
  workflow_dispatch:
    inputs:
      stage: {description: "pca | cache", required: true}
      set: {description: "in100 | in1k", required: true, default: in100}
      teacher: {description: "teacher name, e.g. dinov2_l or siglip2_l", required: true, default: dinov2_l}
      parts: {description: "how many slices the training set is cut into (must match across stages)", required: false, default: "20"}
      subsplits: {description: "cache stage: runners per slice (2-3 for in1k to stay under 6 h)", required: false, default: "1"}

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CACHES_REPO: nakas/opendino-caches      # public: teacher features only, no images
  STRIDE: ${{ inputs.set == 'in100' && '10' || '1' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env: {STAGE: "${{ inputs.stage }}", PARTS: "${{ inputs.parts }}", SUB: "${{ inputs.subsplits }}"}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          stage, parts, sub = os.environ["STAGE"], int(os.environ["PARTS"]), int(os.environ["SUB"])
          if stage == "pca":
              items = [{"part": 0, "sub": 0}]
          elif stage == "cache":
              items = [{"part": p, "sub": j} for p in range(parts) for j in range(sub)]
          else:
              raise SystemExit(f"unknown stage {stage}")
          print("matrix=" + json.dumps({"include": items}))
          EOF

  work:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      PART: ${{ matrix.part }}
      SUB: ${{ matrix.sub }}
      NSUB: ${{ inputs.subsplits }}
      PARTS: ${{ inputs.parts }}
      SET: ${{ inputs.set }}
      TEACHER: ${{ inputs.teacher }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - name: Install (CPU-only torch)
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e . pyarrow huggingface_hub
          echo "runner: $(nproc) vCPUs, $(free -g | awk '/Mem/{print $2}') GB RAM, $(df -h . | awk 'NR==2{print $4}') free disk"
      - name: Rebuild this slice of the training set
        run: |
          python scripts/shards_from_hf.py --split train --worker "$PART" --workers "$PARTS" \
            --class-stride "$STRIDE" --out shard --cache-dir /tmp/hfcache
      - name: Fit PCA
        if: inputs.stage == 'pca'
        run: |
          python -c "import huggingface_hub as h; h.HfApi().create_repo('$CACHES_REPO', repo_type='dataset', private=False, exist_ok=True)"
          python scripts/cache_teacher.py --shards shard --teacher "$TEACHER" --pca-only \
            --pca-images 4000 --batch 32 --workers 4 --out pca
          ./scripts/hf_upload_retry.sh "$CACHES_REPO" pca/pca_fit.npz "$SET/$TEACHER/pca_fit.npz"
      - name: Cache teacher targets
        if: inputs.stage == 'cache'
        run: |
          hf download "$CACHES_REPO" --repo-type dataset --include "$SET/$TEACHER/pca_fit.npz" --local-dir pca
          N=$(python -c "import json; print(json.load(open('shard/meta.json'))['num_images'])")
          START=$(( N * SUB / NSUB )); END=$(( N * (SUB + 1) / NSUB ))
          NAME=$(printf "part_%03d_%02d" "$PART" "$SUB")
          python scripts/cache_teacher.py --shards shard --teacher "$TEACHER" \
            --pca-fit "pca/$SET/$TEACHER/pca_fit.npz" --start "$START" --end "$END" \
            --batch 32 --workers 4 --out "cache/$NAME"
          ./scripts/hf_upload_retry.sh "$CACHES_REPO" "cache/$NAME" "$SET/$TEACHER/$NAME"
