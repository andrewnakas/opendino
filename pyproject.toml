[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendino"
version = "0.0.1"
description = "Clean-room, Apache-2.0 multi-teacher distillation of small vision encoders"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0.15", "numpy", "pyyaml", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["opendino*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
